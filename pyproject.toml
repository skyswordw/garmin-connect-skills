[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "garmin-connect-skills"
version = "0.1.0a1"
description = "Local Garmin Connect summaries and Agent Skills, with China-region support"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "garminconnect==0.3.17",
  "platformdirs>=4.3,<5",
  "filelock>=3.18,<4",
  "tzdata>=2025.2",
]

[project.scripts]
garmin-skills = "garmin_connect_skills.cli:main"

[project.urls]
Repository = "https://github.com/skyswordw/garmin-connect-skills"
Issues = "https://github.com/skyswordw/garmin-connect-skills/issues"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_connect_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
